## As of 2026-10-26
## This has been tested on the following system:
## All operating systems
## Multiple GPUs
## Windows HDR Color disabled
##
## Windows HDR has a bad tone-mapping effect on SDR content
## which results in heavy banding and blocking,
## so we do NOT want to use it.

profile=gpu-hq

# HW Accel Settings
vo=gpu-next

cache=yes
cache-pause-initial=yes
cache-pause-wait=8
demuxer-max-bytes=512MiB
demuxer-readahead-secs=10

target-prim=bt.709
target-trc=bt.1886
dither-depth=10
tone-mapping=bt.2446a
gamut-mapping-mode=relative
hdr-compute-peak=no
#hdr-compute-peak=yes # Toggle this on for HDR sources where the mastering metadata is too dim
hdr-peak-percentile=99.95
hdr-contrast-recovery=0.5

# Window
keep-open=yes
cursor-autohide=100

# Audio
volume=100
volume-max=200
audio-file-auto=fuzzy
af=lavfi=[loudnorm=I=-16:TP=-1.5:LRA=16:dual_mono=true]

# Subtitles
# This sets default styles for SRT subtitles
# It will not override ASS styles
demuxer-mkv-subtitle-preroll=yes
sub-fix-timing=no
sub-auto=fuzzy
sub-gauss=1.0
sub-gray=yes
sub-font=Candara
sub-font-size=52
sub-blur=0.2
sub-border-color=0.0/0.0/0.0/1.0
sub-border-size=3.0
sub-color=1.0/1.0/1.0/1.0
sub-margin-x=100
sub-margin-y=50
sub-shadow-color=0.0/0.0/0.0/0.25
sub-shadow-offset=0
blend-subtitles=yes

# Screenshots
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=3
screenshot-template="%x/%f-%wH.%wM.%wS.%wT-F%{estimated-frame-number}-%03n"

# Playback
deband=no # turn off by default, toggle with 'b' hotkey
# if we're turning it on, it's usually for a Youtube source
# so we want it to be slightly stronger than the defaults
deband-iterations=3
deband-threshold=45
deband-range=25
deband-grain=15

scale=ewa_lanczossharp
dscale=hermite
cscale=spline36
glsl-shader="~~/shaders/ravu-zoom-ar-r3.hook"
glsl-shader="~~/shaders/CfL_Prediction.glsl"
glsl-shader="~~/shaders/area-downscale.glsl"

ytdl-format="(bv*+ba/b)[format_id!$=-drc]"
ytdl-raw-options-append=ignore-config=
ytdl-raw-options-append=compat-options=no-live-chat
ytdl-raw-options-append=format-sort=res,hdr,fps,vcodec:av01:h265:vp9.2:vp9:h264,vbr,lang:en:ja,acodec,abr
ytdl-raw-options-append=cookies-from-browser=firefox

# I have 2-pass loudnorm run on all of my archived music files,
# so I don't want mpv doing it a second time with 1-pass.
[music]
profile-desc=Disable loudnorm for music
profile-cond=get('filename', ''):match('%.opus$') ~= nil
af=""
