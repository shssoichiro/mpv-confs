## As of 2026-01-21
##
## This should work on most modern systems with GPU acceleration.
##
## Windows HDR has a bad tone-mapping effect on SDR content
## which results in heavy banding and blocking,
## so we do NOT want to use it.

profile=gpu-hq

# HW Accel Settings
vo=gpu-next
hwdec=auto-copy-safe
hwdec-codecs=all

cache=yes
demuxer-max-bytes=512MiB
demuxer-readahead-secs=10

# You can change this to `dci-p3` if you have a monitor that fully supports it.
target-prim=bt.709
target-trc=bt.1886
# On some linux systems this only works if you manually specify it,
# so specify it to your monitor's output depth to be safe.
# On Windows "auto" seems to work fine.
dither-depth=10
# I tested these and prefer the quality they give
tone-mapping=bt.2446a
gamut-mapping-mode=relative
hdr-compute-peak=no
hdr-contrast-recovery=0.5
# Some users may prefer these instead of `hdr-compute-peak=no`
#hdr-compute-peak=yes
#hdr-peak-percentile=99.95

# Window
keep-open=yes
cursor-autohide=100

# Audio
volume=100
volume-max=200
audio-file-auto=fuzzy
# I prefer the loudness of these custom settings over the defaults
af=lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11:dual_mono=true]

# Subtitles
# This sets default styles for SRT subtitles
# It will not override ASS styles
demuxer-mkv-subtitle-preroll=yes
sub-fix-timing=no
sub-auto=fuzzy
sub-gauss=1.0
sub-gray=yes
sub-font=Candara
sub-font-size=52
sub-blur=0.2
sub-border-color=0.0/0.0/0.0/1.0
sub-border-size=3.0
sub-color=1.0/1.0/1.0/1.0
sub-margin-x=100
sub-margin-y=50
sub-shadow-color=0.0/0.0/0.0/0.25
sub-shadow-offset=0
blend-subtitles=yes

# Screenshots
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=3
screenshot-directory="C:\Users\me\Downloads"
screenshot-template="%f-%wH.%wM.%wS.%wT-F%{estimated-frame-number}-%03n"

# Playback
deband=no # turn off by default, toggle with 'b' hotkey
# if we're turning it on, it's usually for a Youtube source
# so we want it to be slightly stronger than the defaults
deband-iterations=3
deband-threshold=45
deband-range=25
deband-grain=15

scale=ewa_lanczossharp
dscale=hermite
cscale=spline36

# use yt-dlp's format preferences
ytdl-format=ytdl

# I have 2-pass loudnorm run on all of my archived music files,
# so I don't want mpv doing it a second time with 1-pass.
[music]
profile-desc=Disable loudnorm for music
profile-cond=get('filename', ''):match('%.opus$') ~= nil
af=""
